apiVersion: flowmesh/v1
kind: Task

metadata:
  name: fyp-encoder-variants-audit
  annotations:
    description: >-
      Verify the completed Phase-6 encoder-variant report matrix, its declared
      report hashes, and the best observed configuration for each task metric.

spec:
  taskType: python
  image: harbor.lum.id/cyx-fyp/representation-learning-framework:flowmesh-v0.2.0
  entrypoint: main
  emits:
    - encoder_variant_row_coverage
    - encoder_variant_artifact_integrity
    - encoder_variant_matrix_complete
  timeoutSeconds: 300
  network: none
  resources:
    hardware:
      cpu: 1
      memory: 2Gi
  pythonOutput:
    maxBytes: 1048576
  code: |
    def main():
        from platform_integration.flowmesh_artifact_inspection import (
            inspect_encoder_variants,
        )

        return inspect_encoder_variants()

