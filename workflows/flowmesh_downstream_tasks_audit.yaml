apiVersion: flowmesh/v1
kind: Task

metadata:
  name: fyp-downstream-tasks-audit
  annotations:
    description: >-
      Inspect canonical H0 epoch-50 evaluation metrics for classification,
      future-price prediction, and realised-variance prediction in both walks.

spec:
  taskType: python
  image: harbor.lum.id/cyx-fyp/representation-learning-framework:flowmesh-v0.2.0
  entrypoint: main
  emits:
    - downstream_task_walk_coverage
    - downstream_primary_metric_finite_fraction
    - downstream_evidence_ready
  timeoutSeconds: 300
  network: none
  resources:
    hardware:
      cpu: 1
      memory: 2Gi
  pythonOutput:
    maxBytes: 1048576
  code: |
    def main():
        from platform_integration.flowmesh_artifact_inspection import (
            inspect_downstream_tasks,
        )

        return inspect_downstream_tasks()

